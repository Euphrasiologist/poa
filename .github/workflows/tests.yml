# Unit tests on every push and pull request. The external tools (HMMER,
# tRNAscan-SE, orfedit, transsplice, gfatk, BLAST+) are not installed here:
# the unit tests need only poa's Python dependencies, and the few that call
# a tool skip themselves without it. The end-to-end check
# (tests/smoke/run_smoke.sh) needs the tools and is run by hand.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poa
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
          ls -l dist
