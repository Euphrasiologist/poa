# Conda/mamba environment for poa: every third-party tool it runs, plus the
# rust toolchain install.sh uses for gfatk/orfedit/transsplice until those
# are on bioconda. Then:
#
#   mamba env create -f environment.yml
#   conda activate poa
#   ./install.sh        # the Rust tools
#   pip install .       # poa itself
#
# Versions pinned to what this pipeline was built and validated against
# (checked via `<tool> --version` on the reference install). Newer
# patch/minor versions will likely work but haven't been verified.
name: poa
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas
  - numpy
  - biopython

  # gene calling (denovo_annotation) - hmmer also prepares the bundled oatkDB
  - hmmer=3.4
  - trnascan-se=2.0.12
  - barrnap=0.9

  # reference-profile building (editing, trans_splicing)
  - mafft=7.525

  # assembly graph / sequence tools (qc_basic_stats, linearize)
  - minimap2=2.28
  - samtools=1.21
  - seqkit=2.10.0
  - gfatools=0.5

  # linearize: read-evidence resolution (gfatk resolve)
  - graphaligner=1.0.19

  # rust toolchain, for install.sh
  - rust

  - pip
