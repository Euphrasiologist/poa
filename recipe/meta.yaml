{% set name = "poa" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Euphrasiologist/poa/archive/refs/tags/{{ version }}.tar.gz
  sha256: 860ae168a972d710b91ae1e204ef7de56b28909a6961dd254b0b846db925c4aa

build:
  number: 0
  noarch: python
  entry_points:
    - poa = poa.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - pandas >=2,<3
    - numpy
    - biopython
    - click >=8
    # poa run
    - hmmer >=3.4
    - trnascan-se >=2.0.12
    - orfedit >=0.2.0
    - transsplice >=0.3.1
    # dataset-scale stages (QC, linearize); mafft and graphaligner are left
    # out because bioconda lacks builds for some platforms - poa check
    # lists them as optional
    - gfatk >=0.6.2
    - gfatools >=0.5
    - seqkit >=2.10
    - minimap2 >=2.28
    - samtools >=1.21

test:
  imports:
    - poa
  commands:
    - poa --help
    - poa run --help
    - POA_CACHE=$PWD/poa_cache poa check

about:
  home: https://github.com/Euphrasiologist/poa
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - src/poa/data/oatkdb/NOTICE
    - src/poa/data/rrna/NOTICE
  summary: Annotate plant mitochondrial and plastid genomes, with RNA-editing-aware ORFs and spliced-gene reconstruction
  dev_url: https://github.com/Euphrasiologist/poa

extra:
  recipe-maintainers:
    - Euphrasiologist
