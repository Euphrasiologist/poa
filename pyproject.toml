[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poa"
version = "0.3.3"
description = "Plant organelle annotator: gene calling, RNA-editing-aware ORFs, spliced-gene reconstruction and contig/unitig GFF3 for plant mitochondrial and plastid genomes"
readme = "README.md"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "src/poa/data/*/NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Max Brown" }]
dependencies = ["pandas>=2,<3", "numpy", "biopython", "click>=8"]

[project.urls]
Homepage = "https://github.com/Euphrasiologist/poa"

[project.scripts]
poa = "poa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ship the whole tree, not just modules: the command-line wrappers (src/),
# shell helpers, READMEs and bundled reference data
[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/lineages/*/plastid/genbank/*"]

[tool.black]
line-length = 120
target-version = ["py310"]
